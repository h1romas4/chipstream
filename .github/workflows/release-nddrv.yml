name: Release nddrv

on:
  push:
    tags:
      - 'nddrv-*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: linux-x86_64
            runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config libasound2-dev libpipewire-0.3-dev libclang-dev libfontconfig-dev
          libxkbcommon-dev libxkbcommon-x11-dev

      - name: Build nddrv
        run: cargo build --release --locked -p nddrv --target ${{ matrix.target }}

      - name: Verify Windows executable icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class IconResource {
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              public static extern IntPtr LoadLibraryEx(string path, IntPtr file, uint flags);
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              public static extern IntPtr FindResource(IntPtr module, IntPtr name, IntPtr type);
              [DllImport("kernel32.dll", SetLastError = true)]
              public static extern bool FreeLibrary(IntPtr module);
          }
          '@
          $exe = Join-Path $PWD 'target/${{ matrix.target }}/release/nddrv.exe'
          $module = [IconResource]::LoadLibraryEx($exe, [IntPtr]::Zero, 2)
          if ($module -eq [IntPtr]::Zero) {
            throw "Could not open executable resource: $exe"
          }
          try {
            if ([IconResource]::FindResource($module, [IntPtr]1, [IntPtr]14) -eq [IntPtr]::Zero) {
              throw "Executable is missing the application icon resource"
            }
          } finally {
            [void][IconResource]::FreeLibrary($module)
          }

      - name: Install cargo-packager
        if: runner.os == 'macOS'
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Package macOS app and disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.name }}
        run: |
          cargo packager --release --packages nddrv --target "$TARGET" --formats dmg
          shopt -s nullglob
          images=(target/"$TARGET"/release/NDDRV_*.dmg)
          if [[ ${#images[@]} -ne 1 ]]; then
            echo "Expected exactly one NDDRV disk image; found ${#images[@]}" >&2
            exit 1
          fi
          mountpoint="$RUNNER_TEMP/nddrv-dmg"
          mkdir -p "$mountpoint"
          hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint"' EXIT
          app="$mountpoint/NDDRV.app"
          test -x "$app/Contents/MacOS/nddrv"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = io.github.h1romas4.nddrv
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist")"
          cmp crates/nddrv/assets/icon/nddrv-icon.icns "$app/Contents/Resources/nddrv-icon.icns"
          case "$TARGET" in
            aarch64-apple-darwin) arch=arm64 ;;
            x86_64-apple-darwin) arch=x86_64 ;;
            *) echo "Unexpected macOS target: $TARGET" >&2; exit 1 ;;
          esac
          lipo "$app/Contents/MacOS/nddrv" -verify_arch "$arch"
          cp "${images[0]}" "nddrv-$PLATFORM.dmg"

      - name: Prepare distribution
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p package
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp "target/$TARGET/release/nddrv.exe" package/
            cp "target/$TARGET/release/nddrv.exe" "nddrv-${{ matrix.name }}.exe"
          else
            cp "target/$TARGET/release/nddrv" package/
          fi
          cp crates/nddrv/README.md package/README.md
          cp crates/nddrv/CHANGELOG.md package/CHANGELOG.md

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'package/*' -DestinationPath 'nddrv-${{ matrix.name }}.zip'

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf 'nddrv-${{ matrix.name }}.tar.gz' -C package .

      - uses: actions/upload-artifact@v7
        with:
          name: nddrv-${{ matrix.name }}
          path: nddrv-${{ matrix.name }}.*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: nddrv-*
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nddrv-windows-x86_64.zip
            dist/nddrv-windows-x86_64.exe
            dist/nddrv-linux-x86_64.tar.gz
            dist/nddrv-macos-aarch64.tar.gz
            dist/nddrv-macos-aarch64.dmg
            dist/nddrv-macos-x86_64.tar.gz
            dist/nddrv-macos-x86_64.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true