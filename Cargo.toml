[workspace]
resolver = "3"
members = [
	"crates/chipstream",
	"crates/chipstream-ndsif",
	"crates/chipstream-gstreamer",
	"crates/ndsif-transport",
	"crates/cstools",
	"crates/mmlx",
	"crates/ndsif",
	"crates/soundlog",
	"crates/soundlog-cli",
	"crates/soundlog-gui",
	"crates/chipstream-gstreamer/xtasks",
	"crates/nddrv",
]

[workspace.dependencies]
mmlx = { path = "crates/mmlx", version = "0.3.0" }
soundlog = { path = "crates/soundlog", version = "0.16.0" }
