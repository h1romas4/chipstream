[workspace]
resolver = "3"
members = [
	"crates/chipstream",
	"crates/chipstream-gstreamer",
	"crates/cstools",
	"crates/mmlx",
	"crates/ndsif",
	"crates/soundlog",
	"crates/soundlog-cli",
	"crates/soundlog-gui",
	"crates/chipstream-gstreamer/xtasks",
]

[workspace.dependencies]
mmlx = { path = "crates/mmlx", version = "0.3.0-dev" }
soundlog = { path = "crates/soundlog", version = "0.16.0-dev" }
