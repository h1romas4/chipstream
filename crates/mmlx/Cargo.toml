[package]
name = "mmlx"
version = "0.1.0"
edition = "2024"

[features]
default = []
cli = ["dep:clap"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
pest = "2.9.1"
pest_derive = "2.9.1"
soundlog = { path = "../soundlog" }

[[bin]]
name = "mmlx"
path = "src/bin/mmlx.rs"
required-features = ["cli"]
