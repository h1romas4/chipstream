[package]
name = "soundlog-cli"
version = "0.14.0"
edition = "2024"
rust-version = "1.97.1"
description = "Command-line tools for soundlog."
license = "MIT"
authors = ["h1romas4 <h1romas4@gmail.com>"]
repository = "https://github.com/h1romas4/chipstream"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
flate2 = "1.0"
anyhow = "1.0"
comfy-table = "6"
unicode-width = "0.1"
hound = "3"
mmlx = { workspace = true }
soundlog = { workspace = true, features = ["mdx"] }

[[bin]]
name = "soundlog"
path = "src/bin/soundlog.rs"

[[bin]]
name = "soundlog-prof"
path = "src/bin/soundlog_prof.rs"

[[bin]]
name = "soundlog-micro"
path = "src/bin/soundlog_micro.rs"

[[bin]]
name = "soundlog-mml-prof"
path = "src/bin/soundlog_mml_prof.rs"
