[package]
name = "cstools"
version = "0.1.0"
edition = "2024"
description = "Command-line player for chipstream."
license = "BSD-3-Clause"
authors = ["h1romas4 <h1romas4@gmail.com>"]
repository = "https://github.com/h1romas4/chipstream"
readme = "README.md"

[dependencies]
anyhow = "1.0"
chipstream = { path = "../chipstream", version = "0.1.0", features = ["ay8910", "c140", "c352", "ga20", "huc6280", "k051649", "k053260", "k054539", "mikey", "multipcm", "nes_apu", "nes_fds", "okim6258", "okim6295", "pokey", "pwm", "qsound", "saa1099", "segapcm", "sn76496", "upd7759", "x1010", "ymz280b"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
cpal = { version = "0.18.2", features = ["audioworklet"] }
flate2 = "1.0"
hound = "3.5"
mmlx = { workspace = true, features = ["source-map"] }
soundlog = { workspace = true }
tempfile = "3"
terminal_size = "0.4"

[[bin]]
name = "csplay"
path = "src/bin/csplay.rs"
