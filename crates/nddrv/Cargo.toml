[package]
name = "nddrv"
version = "0.12.0"
edition = "2024"
description = "Desktop VGM and MDX library and player."
license = "BSD-3-Clause"
repository = "https://github.com/h1romas4/chipstream"

[package.metadata.packager]
product-name = "NDDRV"
identifier = "io.github.h1romas4.nddrv"
icons = ["assets/icon/nddrv-icon.icns"]

[package.metadata.packager.macos]
info_plist_path = "assets/recording-info.plist"

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[dependencies]
anyhow = "1"
chipstream = { path = "../chipstream", features = ["c140", "okim6258", "okim6295", "pwm", "segapcm", "sn76496"] }
chipstream-ndsif = { path = "../chipstream-ndsif" }
chrono = "0.4"
cpal = "0.18.2"
directories = "6"
flate2 = "1"
gpui-kit = "0.9.0"
hound = "3.5"
image = { version = "0.25", default-features = false }
ndsif = { path = "../ndsif" }
ndsif-transport = { path = "../ndsif-transport" }
rfd = "0.17.2"
roxmltree = "0.21.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.10.1", default-features = false }
soundlog = { workspace = true, features = ["mdx"] }
tempfile = "3"
ureq = { version = "3", features = ["json"] }
walkdir = "2"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pipewire"] }
pipewire = "0.10.1"
