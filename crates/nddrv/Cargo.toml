[package]
name = "nddrv"
version = "0.1.0"
edition = "2024"
description = "Desktop VGM and MDX library and player."
license = "BSD-3-Clause"
repository = "https://github.com/h1romas4/chipstream"

[dependencies]
anyhow = "1"
chipstream = { path = "../chipstream", features = ["c140", "okim6258", "okim6295", "pwm", "segapcm", "sn76496"] }
cpal = "0.18.2"
directories = "6"
flate2 = "1"
gpui-kit = "0.8.1"
ndsif = { path = "../ndsif" }
ndsif-transport = { path = "../ndsif-transport" }
rfd = "0.17.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.7", default-features = false }
soundlog = { workspace = true, features = ["mdx"] }
tempfile = "3"
ureq = { version = "3", features = ["json"] }
walkdir = "2"
