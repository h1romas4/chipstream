[package]
name = "chipstream-gstreamer"
version = "0.1.0"
edition = "2024"
description = "GStreamer plugin for chipstream VGM and MDX playback."
license = "BSD-3-Clause"
authors = ["h1romas4 <h1romas4@gmail.com>"]
repository = "https://github.com/h1romas4/chipstream"
readme = "README.md"

[lib]
name = "gstchipstream"
crate-type = ["cdylib", "rlib"]

[dependencies]
chipstream = { path = "../chipstream", version = "0.1.0", features = ["c140", "okim6258", "okim6295", "pwm", "segapcm", "sn76496"] }
chipstream-ndsif = { path = "../chipstream-ndsif", version = "0.1.0" }
ndsif-transport = { path = "../ndsif-transport", version = "0.1.0" }
gstreamer = "0.25"
gstreamer-audio = "0.25"
gstreamer-base = "0.25"
flate2 = "1.0"
soundlog = { workspace = true, features = ["mdx"] }

[dev-dependencies]
ndsif = { path = "../ndsif" }
serialport = { version = "4.10.1", default-features = false }
