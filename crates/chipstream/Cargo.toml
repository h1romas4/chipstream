[package]
name = "chipstream"
version = "0.1.0"
edition = "2024"
description = "Sound engine for games using retro sound chips."
license = "BSD-3-Clause AND Apache-2.0 AND MIT"
authors = ["h1romas4 <h1romas4@gmail.com>"]
repository = "https://github.com/h1romas4/chipstream"
readme = "README.md"
keywords = ["audio", "sound", "game", "vgm", "mdx"]
categories = ["multimedia::audio", "game-development"]

[features]
default = []
c140 = []
c352 = []
es5503 = []
gb_dmg = []
ga20 = []
huc6280 = []
k051649 = []
k053260 = []
k054539 = []
mikey = []
multipcm = []
nes_apu = []
nes_fds = ["nes_apu"]
okim6258 = []
okim6295 = []
pokey = []
pwm = []
rf5c = []
saa1099 = []
segapcm = []
sn76496 = []
upd7759 = []
vsu = []
wonderswan = []
x1010 = []
ymz280b = []

[dependencies]
soundlog = { workspace = true, features = ["mdx"] }
ymfm-sys = "0.3.0"
