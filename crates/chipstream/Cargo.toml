[package]
name = "chipstream"
version = "0.2.0"
edition = "2024"
description = "Sound engine for games using retro sound chips."
license = "BSD-3-Clause"
authors = ["h1romas4 <h1romas4@gmail.com>"]
repository = "https://github.com/h1romas4/chipstream"
readme = "README.md"
keywords = ["audio", "sound", "game", "vgm", "mdx"]
categories = ["multimedia::audio", "game-development"]
exclude = ["BACKLOG.md"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []
mdx = ["soundlog/mdx"]
s98 = ["soundlog/s98"]
xgm = ["soundlog/xgm"]
ay8910 = []
c140 = []
c352 = []
es5503 = []
es550x = []
gb_dmg = []
ga20 = []
huc6280 = []
k051649 = []
k053260 = []
k054539 = []
mikey = []
multipcm = []
nes_apu = []
nes_fds = ["nes_apu"]
okim6258 = []
okim6295 = []
pokey = []
qsound = []
pwm = []
rf5c = []
saa1099 = []
scsp = []
segapcm = []
sn76496 = []
upd7759 = []
vsu = []
wonderswan = []
x1010 = []
ymz280b = []
ymf271 = []

[dependencies]
soundlog = { workspace = true }
ymfm-sys = "0.3.0"

[dev-dependencies]
soundlog = { workspace = true, features = ["s98"] }
