[package]
name = "chipstream"
version = "0.1.0"
edition = "2024"
description = "Sound engine for games using retro sound chips."
license = "BSD-3-Clause"
authors = ["h1romas4 <h1romas4@gmail.com>"]
repository = "https://github.com/h1romas4/chipstream"
readme = "README.md"
keywords = ["audio", "sound", "game", "vgm", "mdx"]
categories = ["multimedia::audio", "game-development"]

[features]
default = []
c140 = []
okim6258 = []
okim6295 = []
pwm = []
segapcm = []
sn76496 = []

[dependencies]
soundlog = { workspace = true, features = ["mdx"] }
ymfm-sys = "0.2.0"
