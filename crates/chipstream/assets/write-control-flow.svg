<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1720" viewBox="0 0 1440 1720" role="img" aria-labelledby="title description">
  <title id="title">Chip writes, visualization, and control</title>
  <desc id="description">A VGM, MDX, or XGM v1 sequencer schedules original chip writes. All three support state-change callbacks on the original writes; VGM and MDX also expose typed write callbacks. A write filter can transform writes using application mute settings before the selected sound chip receives them. A chip factory chooses a built-in or custom backend. A custom sequencer can produce VGM commands for VgmSequencer::from_generator, which uses VgmStream::from_generator internally, or drive a SoundChip directly and handle scheduling and observation itself.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#14856f"/>
    </marker>
    <marker id="config-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#b47218"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172f40; }
      .hero-title { font-size: 34px; font-weight: 700; fill: #ffffff; }
      .hero-sub { font-size: 17px; fill: #c4dbe3; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2px; fill: #74dfc3; }
      .section { font-size: 21px; font-weight: 700; }
      .section-note { font-size: 14px; fill: #617681; }
      .card-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; fill: #405b69; }
      .small { font-size: 13px; fill: #617681; }
      .tag { font-size: 12px; font-weight: 700; letter-spacing: 0.8px; fill: #16725f; }
      .config-title { font-size: 15px; font-weight: 700; fill: #865513; }
      .config-body { font-size: 14px; fill: #765d3a; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 13px; fill: #405b69; }
      .signal { fill: none; stroke: #14856f; stroke-width: 3; marker-end: url(#arrow); }
      .config { fill: none; stroke: #b47218; stroke-width: 2.5; stroke-dasharray: 6 5; marker-end: url(#config-arrow); }
    </style>
  </defs>

  <rect width="1440" height="1720" fill="#f3f7f7"/>
  <rect width="1440" height="158" fill="#123548"/>
  <text x="64" y="43" class="eyebrow">CHIPSTREAM / WRITES AND CONTROL</text>
  <text x="64" y="91" class="hero-title">From chip writes to application controls</text>
  <text x="64" y="124" class="hero-sub">Observe the source, transform writes, and choose how each chip is driven.</text>
  <rect x="1100" y="53" width="276" height="48" rx="24" fill="#204b5b" stroke="#477383"/>
  <text x="1238" y="83" text-anchor="middle" class="hero-sub">VGM  ·  MDX  ·  XGM v1  ·  custom</text>

  <text x="64" y="208" class="section">Sources and backend configuration</text>
  <text x="1376" y="207" text-anchor="end" class="section-note">Factories configure backends; they do not process writes.</text>

  <rect x="64" y="232" width="330" height="166" rx="14" fill="#ffffff" stroke="#d4e2e2"/>
  <text x="88" y="264" class="tag">SOURCE</text>
  <text x="88" y="296" class="card-title">Music data</text>
  <text x="88" y="324" class="body">VGM, MDX (+ optional PDX), or XGM v1</text>
  <text x="88" y="349" class="body">or a custom VGM command generator</text>
  <text x="88" y="376" class="small">The generator handles its own loops.</text>

  <rect x="447" y="232" width="440" height="166" rx="14" fill="#ffffff" stroke="#b6d6d0"/>
  <text x="471" y="264" class="tag">SEQUENCER</text>
  <text x="471" y="296" class="card-title">VGM / MDX / XGM sequencer</text>
  <text x="471" y="324" class="body">Schedule original typed writes</text>
  <text x="471" y="349" class="body">for each chip instance.</text>
  <text x="471" y="376" class="small">Callbacks, filters, and factories are optional.</text>
  <path d="M394 315H435" class="signal"/>

  <rect x="940" y="232" width="436" height="166" rx="14" fill="#fff9ee" stroke="#ecd5ae"/>
  <text x="964" y="264" class="config-title">ChipFactoryRegistry</text>
  <text x="964" y="296" class="body">Register a factory by chip type;</text>
  <text x="964" y="321" class="body">select a backend for each instance.</text>
  <text x="964" y="350" class="mono">from_vgm_with_factories(...)</text>
  <text x="964" y="376" class="small">Factory constructors also exist for MDX, XGM, and generators.</text>
  <path d="M940 315H899" class="config"/>

  <rect x="64" y="465" width="1312" height="601" rx="20" fill="#e5f2ef" stroke="#c5e0d9"/>
  <text x="88" y="507" class="section">Write observation and filtering</text>
  <rect x="1067" y="484" width="275" height="32" rx="16" fill="#ffffff"/>
  <text x="1204" y="505" text-anchor="middle" class="tag">PER CHIP / INSTANCE</text>

  <path d="M667 398V440H48V530H260V550" class="signal"/>
  <path d="M667 440H920V530H710V550" class="signal"/>
  <circle cx="667" cy="440" r="4" fill="#14856f"/>
  <path d="M1158 398H1395V530H1172V550" class="config"/>

  <rect x="88" y="550" width="344" height="154" rx="14" fill="#ffffff" stroke="#c5dfd9"/>
  <text x="109" y="581" class="tag">OBSERVE / ORIGINAL WRITES</text>
  <text x="109" y="612" class="card-title">Write and state callbacks</text>
  <text x="109" y="640" class="body">All three: on_state_change()</text>
  <text x="109" y="663" class="body">VGM and MDX: also on_write()</text>
  <text x="109" y="687" class="small">Original writes, even when filtered</text>

  <rect x="530" y="550" width="360" height="154" rx="14" fill="#ffffff" stroke="#c5dfd9"/>
  <text x="551" y="581" class="tag">TRANSFORM / BEFORE CHIP</text>
  <text x="551" y="612" class="card-title">filter_write()</text>
  <text x="551" y="640" class="body">Use application settings to change</text>
  <text x="551" y="663" class="body">a chip-specific register write.</text>
  <text x="551" y="687" class="small">Returns one write of the same type</text>

  <rect x="1000" y="550" width="344" height="154" rx="14" fill="#ffffff" stroke="#c5dfd9"/>
  <text x="1021" y="581" class="tag">BACKEND / PER INSTANCE</text>
  <text x="1021" y="612" class="card-title">SoundChip</text>
  <text x="1021" y="640" class="body">Built-in emulation or a custom</text>
  <text x="1021" y="663" class="body">software / hardware backend.</text>
  <text x="1021" y="687" class="small">Receives the transformed write</text>
  <path d="M890 627H988" class="signal"/>

  <path d="M260 704V755" class="signal"/>
  <path d="M710 755V716" class="config"/>
  <path d="M1172 704V755" class="signal"/>

  <rect x="88" y="755" width="344" height="217" rx="14" fill="#ffffff" stroke="#c5dfd9"/>
  <text x="109" y="785" class="tag">APPLICATION / DISPLAY</text>
  <text x="109" y="815" class="card-title">Keyboard visualization</text>
  <text x="109" y="840" class="body">KeyOn / KeyOff → channel state</text>
  <text x="109" y="862" class="body">Tone frequency, if present → key</text>
  <rect x="110" y="884" width="224" height="51" rx="4" fill="#ffffff" stroke="#9bb6b6"/>
  <path d="M142 884V935M174 884V935M206 884V935M238 884V935M270 884V935M302 884V935" fill="none" stroke="#9bb6b6"/>
  <rect x="143" y="885" width="30" height="49" fill="#74dfc3"/>
  <rect x="132" y="885" width="18" height="29" rx="2" fill="#204b5b"/>
  <rect x="164" y="885" width="18" height="29" rx="2" fill="#204b5b"/>
  <rect x="228" y="885" width="18" height="29" rx="2" fill="#204b5b"/>
  <rect x="260" y="885" width="18" height="29" rx="2" fill="#204b5b"/>
  <rect x="292" y="885" width="18" height="29" rx="2" fill="#204b5b"/>
  <text x="109" y="956" class="small">Events describe source, not muted output.</text>

  <rect x="530" y="755" width="360" height="217" rx="14" fill="#fff9ee" stroke="#ecd5ae"/>
  <text x="551" y="785" class="config-title">Application mute state</text>
  <text x="551" y="815" class="body">Choose instance and channel, then</text>
  <text x="551" y="838" class="body">apply chip-specific write masking.</text>
  <rect x="551" y="858" width="143" height="35" rx="17" fill="#ffffff" stroke="#d9bc8b"/>
  <circle cx="571" cy="875" r="7" fill="#b47218"/>
  <text x="586" y="880" class="config-body">CH 0 mute</text>
  <text x="551" y="921" class="small">Only future writes are transformed.</text>
  <text x="551" y="943" class="small">Changing the setting alone does not</text>
  <text x="551" y="961" class="small">rewrite the chip's existing registers.</text>

  <rect x="1000" y="755" width="344" height="217" rx="14" fill="#ffffff" stroke="#c5dfd9"/>
  <text x="1021" y="785" class="tag">OUTPUT</text>
  <text x="1021" y="815" class="card-title">Audio path</text>
  <text x="1021" y="844" class="body">Software: native PCM → stereo</text>
  <text x="1021" y="867" class="body">→ resampling → host mix</text>
  <text x="1021" y="902" class="body">Hardware: physical device audio</text>
  <text x="1021" y="925" class="body">must be mixed separately.</text>
  <text x="1021" y="956" class="small">See the chip audio flow diagram.</text>

  <text x="88" y="1020" class="small">Callbacks run during render; use their output-frame positions to align the display with playback.</text>
  <text x="88" y="1042" class="small">Filters can run ahead of returned audio; generated PCM and scheduled hardware writes cannot be changed retroactively.</text>

  <text x="64" y="1129" class="section">Custom sequencer options</text>
  <text x="1376" y="1128" text-anchor="end" class="section-note">Choose direct chip use or a VGM command generator.</text>

  <rect x="64" y="1155" width="396" height="190" rx="14" fill="#ffffff" stroke="#d4e2e2"/>
  <text x="88" y="1187" class="tag">APPLICATION</text>
  <text x="88" y="1218" class="card-title">Custom sequencer</text>
  <text x="88" y="1247" class="body">Read your own music format and</text>
  <text x="88" y="1270" class="body">schedule typed soundlog writes.</text>
  <text x="88" y="1301" class="small">Manage observation and filtering yourself</text>
  <text x="88" y="1323" class="small">when not using the provided sequencers.</text>

  <rect x="522" y="1155" width="382" height="190" rx="14" fill="#ffffff" stroke="#c5dfd9"/>
  <text x="546" y="1187" class="tag">DIRECT CHIP API</text>
  <text x="546" y="1218" class="card-title">SoundChip::write()</text>
  <text x="546" y="1247" class="body">Apply compatible chip-specific writes.</text>
  <text x="546" y="1270" class="body">Capture or generate native samples.</text>
  <text x="546" y="1301" class="small">The application owns the timing and</text>
  <text x="546" y="1323" class="small">audio routing for this path.</text>
  <path d="M460 1250H510" class="signal"/>

  <rect x="966" y="1155" width="410" height="190" rx="14" fill="#fff9ee" stroke="#ecd5ae"/>
  <text x="990" y="1187" class="config-title">Choose a chip implementation</text>
  <text x="990" y="1218" class="body">Use a built-in SoundChip or implement</text>
  <text x="990" y="1241" class="body">the trait for your own backend.</text>
  <text x="990" y="1278" class="small">For the provided sequencers, register</text>
  <text x="990" y="1300" class="small">custom backends with a factory instead.</text>
  <path d="M966 1250H916" class="config"/>

  <rect x="64" y="1372" width="1312" height="146" rx="14" fill="#e5f2ef" stroke="#c5e0d9"/>
  <text x="88" y="1404" class="tag">OR / REUSE THE VGM SEQUENCER</text>
  <text x="88" y="1435" class="card-title">Implement VgmCommandGenerator for your custom sequencer</text>
  <text x="88" y="1461" class="mono">VgmSequencer::from_generator(Box::new(source), config, ...)</text>
  <text x="88" y="1486" class="small">The sequencer creates VgmStream::from_generator internally; callbacks and filters follow the flow above.</text>
  <text x="88" y="1506" class="small">Use from_generator_with_factories to replace chip backends on this path.</text>

  <rect x="64" y="1552" width="1312" height="84" rx="14" fill="#ffffff" stroke="#d4e2e2"/>
  <text x="88" y="1583" class="body">Tracker events reflect the original source. A mute filter can make the audible result different.</text>
  <text x="88" y="1608" class="small">For whole-chip or native-output software gain, see the gain controls; they do not control physical hardware audio.</text>

  <path d="M68 1680H116" class="signal"/>
  <text x="130" y="1685" class="small">writes / events / audio</text>
  <path d="M340 1680H388" class="config"/>
  <text x="402" y="1685" class="small">configuration / control</text>
  <text x="1376" y="1685" text-anchor="end" class="small">Application UI and hardware audio are outside chipstream.</text>
</svg>
