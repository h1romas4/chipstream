<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1540" viewBox="0 0 1440 1540" role="img" aria-labelledby="title description">
  <title id="title">Chipstream audio flow and gain controls</title>
  <desc id="description">VGM, MDX, or generator commands are routed to a chip backend per instance. Each backend generates native samples, which are converted to stereo with per-output gains, resampled, and queued. A post-resampling chip gain is applied to each queue as the sequencer mixes the final stereo PCM. Neither gain controls physical hardware audio.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#46617a"/>
    </marker>
    <marker id="audio-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#287a5b"/>
    </marker>
    <marker id="control-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#a8670a"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172b3a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #506477; }
      .heading { font-size: 20px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 15px; fill: #42586b; }
      .tiny { font-size: 13px; fill: #506477; }
      .api { font-size: 16px; font-weight: 700; fill: #895008; }
      .api-small { font-size: 14px; fill: #754d16; }
      .box { stroke-width: 2; rx: 12; }
      .arrow { fill: none; stroke: #46617a; stroke-width: 2.5; marker-end: url(#arrow); }
      .audio { fill: none; stroke: #287a5b; stroke-width: 2.5; marker-end: url(#audio-arrow); }
      .control { fill: none; stroke: #a8670a; stroke-width: 2.5; stroke-dasharray: 8 5; marker-end: url(#control-arrow); }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#f7f9fc"/>
  <text x="54" y="58" class="title">How chip audio becomes stereo PCM</text>
  <text x="54" y="88" class="subtitle">A separate audio lane for each chip instance, combined at the output-rate mixer.</text>

  <rect x="50" y="118" width="1340" height="190" rx="18" fill="#ffffff" stroke="#b8c6d3" stroke-width="2"/>
  <text x="76" y="149" class="heading">1. Choose a source and create the sequencer</text>
  <rect x="70" y="168" width="350" height="116" class="box" fill="#eaf2ff" stroke="#7195c4"/>
  <text x="245" y="194" text-anchor="middle" class="label">Input</text>
  <text x="245" y="219" text-anchor="middle" class="small">VGM bytes / VgmDocument</text>
  <text x="245" y="242" text-anchor="middle" class="small">MDX bytes / MdxPackage + PDX</text>
  <text x="245" y="265" text-anchor="middle" class="tiny">or VgmCommandGenerator</text>

  <rect x="480" y="168" width="440" height="116" class="box" fill="#eaf2ff" stroke="#7195c4"/>
  <text x="700" y="194" text-anchor="middle" class="label">VgmSequencer / MdxSequencer</text>
  <text x="700" y="219" text-anchor="middle" class="small">output rate + chunk size + options</text>
  <text x="700" y="242" text-anchor="middle" class="small">PlaybackOptions: loop count + fade</text>
  <text x="700" y="265" text-anchor="middle" class="tiny">render() advances commands and produces audio</text>
  <path d="M420 226 H470" class="arrow"/>

  <rect x="1000" y="168" width="370" height="116" class="box" fill="#fff3db" stroke="#d3a344"/>
  <text x="1185" y="194" text-anchor="middle" class="label">ChipFactoryRegistry</text>
  <text x="1185" y="219" text-anchor="middle" class="small">select a backend for each instance</text>
  <text x="1185" y="242" text-anchor="middle" class="small">built-in or custom SoundChip</text>
  <text x="1185" y="265" text-anchor="middle" class="tiny">optional replacement factories</text>
  <path d="M1000 226 H930" class="control"/>

  <path d="M700 284 V341" class="arrow"/>
  <rect x="180" y="350" width="1080" height="86" class="box" fill="#fff3db" stroke="#d3a344"/>
  <text x="720" y="378" text-anchor="middle" class="label">Command scheduling and routing</text>
  <text x="720" y="404" text-anchor="middle" class="small">VgmCommand → ChipRegisterWrite; waits and writes advance the matching chip instances</text>
  <rect x="50" y="490" width="1340" height="332" rx="18" fill="#ffffff" stroke="#b8c6d3" stroke-width="2"/>
  <text x="76" y="522" class="heading">2. Per-chip instance: native samples → stereo → output-rate queue</text>
  <path d="M180 393 H26 V614 H67" class="audio"/>

  <rect x="75" y="552" width="230" height="124" class="box" fill="#edf7f1" stroke="#6eaa88"/>
  <text x="190" y="580" text-anchor="middle" class="label">SoundChip</text>
  <text x="190" y="605" text-anchor="middle" class="small">apply writes + generate</text>
  <text x="190" y="630" text-anchor="middle" class="tiny">native-rate samples</text>
  <text x="190" y="652" text-anchor="middle" class="tiny">one backend per instance</text>

  <rect x="330" y="552" width="230" height="124" class="box" fill="#edf7f1" stroke="#6eaa88"/>
  <text x="445" y="580" text-anchor="middle" class="label">ChipCapture</text>
  <text x="445" y="605" text-anchor="middle" class="small">capture() → NativeBlock</text>
  <text x="445" y="630" text-anchor="middle" class="tiny">interleaved i32 outputs</text>
  <text x="445" y="652" text-anchor="middle" class="tiny">at the chip's native rate</text>
  <path d="M305 614 H322" class="audio"/>

  <rect x="585" y="552" width="230" height="124" class="box" fill="#eef2ff" stroke="#8495c7"/>
  <text x="700" y="580" text-anchor="middle" class="label">StereoMatrix</text>
  <text x="700" y="605" text-anchor="middle" class="small">native outputs → L / R</text>
  <text x="700" y="630" text-anchor="middle" class="tiny">matrix levels × output gains</text>
  <text x="700" y="652" text-anchor="middle" class="tiny">native-rate f32 stereo</text>
  <path d="M560 614 H577" class="audio"/>

  <rect x="840" y="552" width="230" height="124" class="box" fill="#eef2ff" stroke="#8495c7"/>
  <text x="955" y="580" text-anchor="middle" class="label">StereoResampler</text>
  <text x="955" y="605" text-anchor="middle" class="small">process() → StereoBlock</text>
  <text x="955" y="630" text-anchor="middle" class="tiny">native → output rate</text>
  <text x="955" y="652" text-anchor="middle" class="tiny">retains resampler history</text>
  <path d="M815 614 H832" class="audio"/>

  <rect x="1095" y="552" width="230" height="124" class="box" fill="#edf7f1" stroke="#6eaa88"/>
  <text x="1210" y="580" text-anchor="middle" class="label">Voice queue</text>
  <text x="1210" y="605" text-anchor="middle" class="small">buffer stereo frames</text>
  <text x="1210" y="630" text-anchor="middle" class="tiny">f32 at output rate</text>
  <text x="1210" y="652" text-anchor="middle" class="tiny">one queue per instance</text>
  <path d="M1070 614 H1087" class="audio"/>

  <rect x="485" y="720" width="430" height="76" class="box" fill="#fff8e9" stroke="#d3a344"/>
  <text x="700" y="747" text-anchor="middle" class="api">output_layout() + set_output_gains()</text>
  <text x="700" y="773" text-anchor="middle" class="api-small">one gain per native output, before resampling</text>
  <path d="M700 720 V685" class="control"/>
  <text x="102" y="774" class="small">Other chip instances follow the same lane.</text>

  <path d="M1210 676 V856 H910 V894" class="audio"/>
  <text x="1070" y="846" text-anchor="middle" class="small">all instance queues</text>
  <text x="76" y="876" class="heading">3. Align, mix, and return audio</text>
  <rect x="375" y="894" width="535" height="110" class="box" fill="#edf7f1" stroke="#6eaa88"/>
  <text x="642" y="922" text-anchor="middle" class="label">StereoMixer::mix</text>
  <text x="642" y="948" text-anchor="middle" class="small">align output-rate frames and add each chip</text>
  <text x="642" y="974" text-anchor="middle" class="tiny">apply each instance's chip gain during mixing</text>

  <rect x="1000" y="894" width="325" height="110" class="box" fill="#fff8e9" stroke="#d3a344"/>
  <text x="1162" y="923" text-anchor="middle" class="api">set_chip_gain()</text>
  <text x="1162" y="949" text-anchor="middle" class="api-small">one gain for the whole instance</text>
  <text x="1162" y="974" text-anchor="middle" class="api-small">after resampling, at the mixer</text>
  <path d="M1000 949 H920" class="control"/>

  <path d="M642 1004 V1048" class="audio"/>
  <rect x="375" y="1057" width="535" height="116" class="box" fill="#eaf2ff" stroke="#7195c4"/>
  <text x="642" y="1086" text-anchor="middle" class="label">render() → StereoBlock</text>
  <text x="642" y="1112" text-anchor="middle" class="small">f32 stereo at the requested output rate</text>
  <text x="642" y="1138" text-anchor="middle" class="tiny">configured fade → optional host effects / audio device</text>
  <text x="642" y="1158" text-anchor="middle" class="tiny">final mix is not clipped; last block may be shorter</text>

  <rect x="50" y="1210" width="650" height="240" class="box" fill="#ffffff" stroke="#b8c6d3"/>
  <text x="76" y="1242" class="heading">Native output gains</text>
  <text x="76" y="1272" class="small">Use output_layout(chip, instance) for the gain order.</text>
  <text x="76" y="1298" class="small">YM2203: [FM, SSG A, SSG B, SSG C]</text>
  <text x="76" y="1324" class="small">YM2608 / YM2610(B): [FM+ADPCM L, R, SSG]</text>
  <text x="76" y="1354" class="tiny">These are backend outputs, not necessarily synthesis channels.</text>
  <text x="76" y="1378" class="tiny">Gains multiply matrix and header levels; stereo masks still apply.</text>
  <text x="76" y="1402" class="tiny">Changes affect newly captured samples, not buffered audio</text>
  <text x="76" y="1424" class="tiny">or resampler history.</text>

  <rect x="740" y="1210" width="650" height="240" class="box" fill="#ffffff" stroke="#b8c6d3"/>
  <text x="766" y="1242" class="heading">Chip gain and hardware</text>
  <text x="766" y="1272" class="small">Chip gain multiplies the whole instance after resampling.</text>
  <text x="766" y="1298" class="small">It also affects buffered PCM that has not yet been mixed.</text>
  <text x="766" y="1324" class="small">Audio already mixed during a seek is unchanged.</text>
  <text x="766" y="1354" class="tiny">Output gains and chip gain multiply each other.</text>
  <text x="766" y="1378" class="tiny">Both default to 1.0; gains must be finite and nonnegative.</text>
  <text x="766" y="1402" class="tiny">Neither controls physical hardware audio; route and mix</text>
  <text x="766" y="1424" class="tiny">hardware output separately.</text>

  <path d="M76 1490 H126" class="audio"/>
  <text x="140" y="1495" class="small">audio / command flow</text>
  <path d="M430 1490 H480" class="control"/>
  <text x="494" y="1495" class="small">configuration / gain control</text>
  <text x="1370" y="1495" text-anchor="end" class="tiny">Both gain APIs are available on VGM and MDX sequencers.</text>
</svg>
