[package]
name = "soundlog"
description = "Builder and parser for retro sound-chip register-write logs (VGM, MDX, XGM, S98)."
version = "0.19.0"
edition = "2024"
license = "MIT"
authors = ["h1romas4 <h1romas4@gmail.com>"]
homepage = "https://github.com/h1romas4"
repository = "https://github.com/h1romas4/chipstream"
readme = "README.md"
keywords = ["vgm", "sound", "audio"]
categories = ["multimedia::audio"]

exclude = [
    "assets/vgm",
    "assets/vgm/**",
]

[lints]
workspace = true

[features]
default = []
mdx = []
s98 = []
xgm = []
